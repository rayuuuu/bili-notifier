<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>B站动态提醒</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <span class="title">B站动态提醒</span>
    <div class="actions">
      <button id="poll-now" type="button" class="btn">立即检查</button>
      <button id="mark-all" type="button" class="btn">全部已读</button>
      <button id="open-options" type="button" class="btn icon" title="设置">⚙</button>
    </div>
  </header>

  <div id="toast" class="toast hidden"></div>

  <main id="list" class="list"></main>

  <section id="empty" class="empty hidden">
    <p class="empty-title">还没有订阅任何 UP 主</p>
    <p class="empty-desc">前往设置页添加 UID，即可在他们发布新动态时收到通知。</p>
    <button id="go-options" type="button" class="btn primary">前往设置</button>
  </section>

  <footer class="statusbar">
    <span id="status">加载中…</span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
